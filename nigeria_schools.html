<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBI: Northern Borno Focused Analysis v10</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #sidebar { 
            width: 320px; 
            height: 100vh; 
            background: #2c3e50; 
            color: white; 
            padding: 25px; 
            box-sizing: border-box; 
            overflow-y: auto; 
            z-index: 1000; 
            box-shadow: 4px 0 10px rgba(0,0,0,0.3); 
        }
        #map { flex: 1; height: 100vh; }
        
        .sidebar-section { margin-bottom: 35px; }
        .sidebar-section h2 { 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-bottom: 2px solid #34495e; 
            padding-bottom: 10px; 
            margin-top: 0;
            color: #ecf0f1;
        }
        
        .toggle-item { 
            display: flex; 
            align-items: center; 
            margin-bottom: 15px; 
            cursor: pointer; 
            transition: color 0.2s;
        }
        .toggle-item:hover { color: #3498db; }
        .toggle-item input { 
            margin-right: 15px; 
            width: 20px; 
            height: 20px; 
            cursor: pointer; 
            accent-color: #3498db;
        }
        
        .legend { 
            background: rgba(0, 0, 0, 0.2); 
            padding: 20px; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            border-left: 4px solid #3498db;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 10px; }
        .legend-color { 
            width: 14px; 
            height: 14px; 
            border-radius: 50%; 
            margin-right: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
        }
        .legend-line { 
            width: 20px; 
            height: 3px; 
            margin-right: 12px; 
            border-radius: 2px;
        }
        .legend-gradient { 
            width: 100%; 
            height: 12px; 
            margin-top: 8px; 
            border-radius: 3px; 
            background: linear-gradient(to right, #edf8fb, #8c96c6, #810f7c);
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-section">
            <h2>Analysis Controls</h2>
            <label class="toggle-item">
                <input type="checkbox" id="toggle-population" checked> 
                Population Density
            </label>
            <label class="toggle-item">
                <input type="checkbox" id="toggle-schools" checked> 
                Schools (All Levels)
            </label>
            <label class="toggle-item">
                <input type="checkbox" id="toggle-access" checked> 
                Access to Schools (Roads)
            </label>
            <label class="toggle-item">
                <input type="checkbox" id="toggle-conflict" checked> 
                Conflict Events (2020-2025)
            </label>
        </div>

        <div class="sidebar-section">
            <h2>Map Legend</h2>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #228b22;"></div> 
                    Primary / Pre-Primary
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff7800;"></div> 
                    Secondary Schools
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #555;"></div> 
                    Main Road Network
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #e74c3c; border: 2px solid #c0392b;"></div> 
                    Conflict Incidents
                </div>
                
                <div style="margin-top: 20px;">
                    <div style="margin-bottom: 5px; font-weight: bold; color: #bdc3c7;">Population Density</div>
                    <div class="legend-gradient"></div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #bdc3c7; margin-top: 5px;">
                        <span>Sparse</span>
                        <span>Dense</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <script>
        // Initialize map
        const map = L.map('map').setView([13.15, 13.7], 9);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const heatGroup = L.layerGroup().addTo(map);
        const roadsGroup = L.layerGroup().addTo(map);
        const primaryGroup = L.layerGroup().addTo(map);
        const secondaryGroup = L.layerGroup().addTo(map);
        const conflictGroup = L.layerGroup().addTo(map);

        // Sidebar Control Logic
        function setupToggle(id, layers) {
            const toggle = document.getElementById(id);
            toggle.addEventListener('change', (e) => {
                layers.forEach(layer => {
                    if (e.target.checked) map.addLayer(layer);
                    else map.removeLayer(layer);
                });
            });
        }

        setupToggle('toggle-population', [heatGroup]);
        setupToggle('toggle-schools', [primaryGroup, secondaryGroup]);
        setupToggle('toggle-access', [roadsGroup]);
        setupToggle('toggle-conflict', [conflictGroup]);

        // 1. Schools (Filtered to Northern Tip)
        fetch('schools_northern_tip.geojson')
            .then(res => res.json())
            .then(data => {
                const layer = L.geoJSON(data, {
                    filter: f => ['Primary', 'Pre Primary', 'Secondary'].includes(f.properties.category),
                    onEachFeature: (f, l) => {
                        l.bindPopup(`<strong>${f.properties.name}</strong><br>Type: ${f.properties.category}`);
                        if (f.properties.category === 'Secondary') secondaryGroup.addLayer(l);
                        else primaryGroup.addLayer(l);
                    },
                    pointToLayer: (f, latlng) => {
                        const color = (f.properties.category === 'Secondary') ? "#ff7800" : "#228b22";
                        return L.circleMarker(latlng, { radius: 6, fillColor: color, color: "#000", weight: 1, fillOpacity: 0.9 });
                    }
                });
                // Auto-fit to the small area
                map.fitBounds(layer.getBounds(), { padding: [50, 50] });
            });

        // 2. Road Network (Northern Tip)
        fetch('roads_northern_tip.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: { color: "#555", weight: 1.5, opacity: 0.7 }
                }).addTo(roadsGroup);
            });

        // 3. Population Heatmap (Northern Tip)
        fetch('populated_places_northern_tip.geojson')
            .then(res => res.json())
            .then(data => {
                const heatPoints = data.features.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0], 0.5]);
                L.heatLayer(heatPoints, { radius: 30, blur: 20, minOpacity: 0.4, gradient: {0.4: '#edf8fb', 0.7: '#8c96c6', 1.0: '#810f7c'} }).addTo(heatGroup);
            });

        // 4. Conflict Events (2020-2025)
        Papa.parse('conflict_events.csv', {
            download: true,
            header: true,
            delimiter: ";",
            complete: function(results) {
                results.data.forEach(row => {
                    const lat = parseFloat(row.latitude) / 1000000;
                    const lon = parseFloat(row.longitude) / 1000000;
                    const year = parseInt(row.year);
                    
                    // Filter: Northern tip + Years 2020-2025
                    if (!isNaN(lat) && !isNaN(lon) && year >= 2020) {
                        if (lon >= 13.0 && lon <= 14.8 && lat >= 12.5 && lat <= 13.8) {
                            const fatalities = parseInt(row.best) || 0;
                            const type = row.conflict_name || "Unknown Conflict";
                            const marker = L.circleMarker([lat, lon], {
                                radius: 5 + Math.sqrt(fatalities) * 3,
                                fillColor: "#e74c3c",
                                color: "#c0392b",
                                weight: 1.5,
                                fillOpacity: 0.7
                            }).bindPopup(`
                                <div style="font-family: sans-serif;">
                                    <h3 style="margin: 0 0 10px 0; color: #c0392b;">Conflict Event (${row.year})</h3>
                                    <strong>Type:</strong> ${type}<br>
                                    <strong>Location:</strong> ${row.where_coordinates}<br>
                                    <strong>Fatalities:</strong> <span style="font-size: 1.2em; color: #e74c3c;">${fatalities}</span><br>
                                    <hr style="margin: 10px 0;">
                                    <strong>Side A:</strong> ${row.side_a}<br>
                                    <strong>Side B:</strong> ${row.side_b}
                                </div>
                            `);
                            conflictGroup.addLayer(marker);
                        }
                    }
                });
            }
        });

    </script>
</body>
</html>
